name: BudgetApp
options:
  bundleIdPrefix: nl.mohammedshieko
  developmentLanguage: nl
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  BudgetApp:
    type: application
    platform: iOS
    sources:
      - path: BudgetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.mohammedshieko.BudgetApp
        PRODUCT_NAME: BudgetApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BudgetApp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - BudgetAppTests
  BudgetAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BudgetAppTests
    dependencies:
      - target: BudgetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.mohammedshieko.BudgetAppTests
        GENERATE_INFOPLIST_FILE: YES
